<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{DESCRIPTION}}">
{{HEAD}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
{{CSS}}
</style>

{{HEADER}}

<main>
  <section class="band" aria-labelledby="h-arsenal"><div class="inner">
    <div style="display:grid;gap:6px;padding-top:30px">
      <span class="kicker">{{t.ui.arsenalKicker}}</span>
      <h1 id="h-arsenal">{{t.ui.arsenalTitle}}</h1>
    </div>
    <div class="types" id="types"></div>
    <div class="stage">
      <div class="showcase" id="showcase"></div>
      <div class="sheet" id="sheet"></div>
    </div>
    <div class="rail" id="rail" aria-label="{{t.ui.railLabel}}"></div>
  </div></section>

  <section class="compare band" aria-labelledby="h-compare"><div class="inner">
    <div style="display:grid;gap:6px">
      <span class="kicker">{{t.ui.compareKicker}}</span>
      <h2 id="h-compare">{{t.ui.compareTitle}}</h2>
    </div>
    <div class="duel" id="duel"></div>
  </div></section>

  <section class="loadout band" aria-labelledby="h-loadout"><div class="inner">
    <div style="display:grid;gap:6px">
      <span class="kicker">{{t.ui.loadoutKicker}}</span>
      <h2 id="h-loadout">{{t.ui.loadoutTitle}}</h2>
    </div>
    <div class="slots" id="slots"></div>
    <div class="verdict">
      <div class="totals" id="totals"></div>
      <div style="display:grid;gap:16px;align-content:start">
        <ul class="advice" id="advice"></ul>
        <div class="share">
          <button id="share" type="button" class="btn">{{t.ui.share}}</button>
          <button id="reset" type="button" class="btn ghost">{{t.ui.recommended}}</button>
          {{SUPPORT}}
          <span class="toast" id="toast" role="status"></span>
        </div>
        {{IGBANNER}}
      </div>
    </div>
  </div></section>

  <section class="index band" aria-labelledby="h-index"><div class="inner">
    <div style="display:grid;gap:6px">
      <span class="kicker">{{t.ui.allWeaponsKicker}}</span>
      <h2 id="h-index">{{t.ui.allWeapons}}</h2>
    </div>
    {{INDEX}}
  </div></section>
</main>

{{FOOTER}}

<script id="game-data" type="application/json">{{DATA}}</script>
<script id="i18n" type="application/json">{{T}}</script>
<script>{{LOGIC}}</script>
<script>
(() => {
  const G = JSON.parse(document.getElementById("game-data").textContent);
  const T = JSON.parse(document.getElementById("i18n").textContent);
  const L = Logic(G, T);
  const { byId, fill, fmt, stateOf, maxOf, rank, trust, pitch, DEFAULT } = L;
  const BASE = "{{BASE}}";
  const $ = (id) => document.getElementById(id);
  const TYPE_ICON = { "One-Handed": "tab-main-one-handed", "Dual-Wield": "tab-main-dual-wield", "Two-Handed": "tab-main-two-handed",
    "Artifice": "tab-phantom-edge-artifice", "Destructive": "tab-phantom-edge-destructive", "Martial": "tab-phantom-edge-martial",
    "Ranged": "tab-phantom-edge-ranged", "Summoning": "tab-phantom-edge-summoning" };
  const STAT_ICON = { damage: "stat-damage", guardBreak: "stat-guard-break", status: "stat-status-effects" };
  const ui = (n) => `${BASE}assets/ui/${n}.webp`;
  const big = (it) => `${BASE}assets/weapons/${it.image}`;
  const thumb = (it) => `${BASE}assets/thumbs/${it.image}`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  let lvl = G.levels[0];
  const S = (it) => it.stats[lvl];

  let loadout = readHash() || DEFAULT.slice();
  let filter = { kind: "blade", type: "" };
  let current = loadout[0], showSrc = false;
  let cmp = [loadout[0], loadout[1]];
  const want = /^#W-([a-z0-9-]+)$/.exec(location.hash);
  if (want && byId[want[1]]) { current = want[1]; filter.kind = byId[current].kind; }

  function readHash() {
    const m = /^#L(\d|M)((?:-\d+){1,8})$/.exec(location.hash);
    if (!m) return null;
    lvl = m[1] === "M" ? G.levels[G.levels.length - 1] : G.levels[0];
    const ids = m[2].slice(1).split("-").map((n) => (G.items[+n] || {}).id);
    return G.slots.map((s, i) => (ids[i] && byId[ids[i]].kind === s.kind ? ids[i] : DEFAULT[i]));
  }
  const hashOf = () => L.hashOf(loadout, lvl);
  const list = () => G.items.filter((i) => i.kind === filter.kind && (!filter.type || i.type === filter.type));

  function renderTypes() {
    const group = (kind, allIcon) => {
      const types = [...new Set(L.pool(kind).map((i) => i.type))];
      const btn = (t, label, icon) => `<button type="button" class="type-btn" data-k="${kind}" data-t="${t}" aria-pressed="${filter.kind === kind && filter.type === t}"><img src="${ui(icon)}" alt="">${label}</button>`;
      return `<div class="type-group"><span>${T.kindsPlural[kind]}</span><div class="type-row">${btn("", T.ui.all, allIcon)}${types.map((t) => btn(t, T.types[t], TYPE_ICON[t])).join("")}</div></div>`;
    };
    $("types").innerHTML = group("blade", "tab-main-all") + group("edge", "tab-phantom-edge-all");
  }
  $("types").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    filter = { kind: b.dataset.k, type: b.dataset.t };
    if (!list().some((i) => i.id === current)) current = list()[0].id;
    renderTypes(); renderStage(true); renderRail();
  });

  function renderStage(animate) {
    const it = byId[current];
    $("showcase").innerHTML = `<button type="button" class="nav-arrow prev" data-step="-1" aria-label="${T.ui.prev}">‹</button>` +
      (it.image ? `<img src="${big(it)}" alt="${esc(it.name)}" class="${animate ? "enter" : ""}">` : `<span class="noimg">${T.ui.noImage}</span>`) +
      `<button type="button" class="nav-arrow next" data-step="1" aria-label="${T.ui.next}">›</button>`;
    if (animate) requestAnimationFrame(() => requestAnimationFrame(() => { const im = $("showcase").querySelector("img"); if (im) im.classList.remove("enter"); }));
    const stats = G.stats.filter((s) => S(it)[s] != null).map((s) =>
      `<div class="stat"><img src="${ui(STAT_ICON[s])}" alt=""><span>${T.stats[s]}</span><span class="bar ${s}"><i style="width:${Math.round(100 * S(it)[s] / maxOf(it.kind, s, lvl))}%"></i></span><span class="num">${fmt(S(it)[s])}</span></div>`).join("");
    const badges = [S(it).guardBreak != null ? `<span class="badge on">${T.ui.badgeGuard}</span>` : "", S(it).status != null ? `<span class="badge on">${T.ui.badgeStatus}</span>` : "",
      `<span class="badge">${it.kind === "edge" ? T.ui.badgeSecondary : T.ui.badgeMain}</span>`].join("");
    const st = stateOf(it);
    const src = Object.entries(it.check.sources).filter(([, v]) => G.stats.some((s) => v[s] != null)).map(([n, v]) => `${n} : ` + G.stats.filter((s) => v[s] != null).map((s) => `${T.stats[s].toLowerCase()} ${fmt(v[s])}`).join(", ")).join(" · ");
    const slots = G.slots.map((s, i) => [s, i]).filter(([s]) => s.kind === it.kind);
    $("sheet").innerHTML = `
      <div class="meta"><span>${T.kinds[it.kind]}</span><span>${T.types[it.type]}</span>${it.rarity ? `<span class="rar-${it.rarity}">${T.rarity[it.rarity]}</span>` : ""}</div>
      <h2 style="font-size:clamp(30px,5vw,48px);line-height:1.05"><a href="weapons/${it.id}/index.html" style="color:inherit;text-decoration:none">${esc(it.name)}</a></h2>
      <p class="pitch">${esc(pitch(it, lvl))}</p>
      <div class="badges">${badges}</div>
      <div class="stats">${stats || `<span class="trust">${T.ui.noStats}</span>`}</div>
      <div class="row">
        <div class="level" role="group" aria-label="${T.ui.levelLabel}">${G.levels.map((l) => `<button type="button" data-l="${l}" aria-pressed="${l === lvl}">${T.levels[l]}</button>`).join("")}</div>
        <span class="trust ${st}"><b>${trust(it)}</b>${src ? ` · <button type="button" id="toggle-src">${showSrc ? T.ui.hideSources : T.ui.showSources}</button>` : ""}</span>
      </div>
      ${showSrc && src ? `<p class="src">${T.ui.sourcesAt1}${esc(src)}.</p>` : ""}
      <div class="equip">${slots.map(([s, i]) => loadout[i] === it.id
        ? `<span class="btn on" aria-current="true">✓ ${T.slots[s.id]}</span>`
        : `<button type="button" class="btn${loadout.includes(it.id) || i % 2 ? " ghost" : ""}" data-slot="${i}">${fill(T.ui.equipIn, { slot: T.slots[s.id].toLowerCase() })}</button>`).join("")}<button type="button" class="btn ghost" id="to-compare">${T.ui.compareBtn}</button></div>`;
  }
  $("showcase").addEventListener("click", (e) => {
    const b = e.target.closest("[data-step]"); if (!b) return;
    const l = list(), i = l.findIndex((x) => x.id === current);
    current = l[(i + +b.dataset.step + l.length) % l.length].id; showSrc = false;
    renderStage(true); renderRail(true);
  });
  $("sheet").addEventListener("click", (e) => {
    const lv = e.target.closest("[data-l]");
    if (lv) { lvl = lv.dataset.l; renderStage(); renderDuel(); renderLoadout(); return; }
    if (e.target.id === "toggle-src") { showSrc = !showSrc; renderStage(); return; }
    if (e.target.id === "to-compare") {
      const it = byId[current];
      if (cmp[1] === current || byId[cmp[1]].kind !== it.kind) cmp[1] = (L.pool(it.kind).find((o) => o.id !== current && o.image) || it).id;
      cmp[0] = current; renderDuel(); $("h-compare").scrollIntoView({ behavior: "smooth", block: "start" }); return;
    }
    const eq = e.target.closest("[data-slot]");
    if (eq) {
      // Si l'arme est déjà dans l'autre emplacement, on échange les deux au lieu de la dupliquer
      const to = +eq.dataset.slot, from = loadout.indexOf(current);
      if (from >= 0) loadout[from] = loadout[to];
      loadout[to] = current; renderStage(); renderRail(); renderLoadout();
    }
  });

  function renderRail(scroll) {
    $("rail").innerHTML = list().map((it) =>
      `<button type="button" class="thumb" data-id="${it.id}" aria-current="${it.id === current}">${it.image ? `<img src="${thumb(it)}" alt="" loading="lazy">` : `<span style="height:64px"></span>`}<span>${esc(it.name)}</span>${loadout.includes(it.id) ? `<span class="eq">${T.ui.equipped}</span>` : ""}</button>`).join("");
    if (scroll) { const a = $("rail").querySelector('[aria-current="true"]'); if (a) a.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" }); }
  }
  $("rail").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]"); if (!b) return;
    current = b.dataset.id; showSrc = false; renderStage(true); renderRail();
  });

  function renderDuel() {
    const [a, b] = cmp.map((id) => byId[id]);
    const opts = (sel) => Object.keys(T.kinds).map((k) => `<optgroup label="${T.kindsPlural[k]}">${L.pool(k).map((o) => `<option value="${o.id}"${o.id === sel ? " selected" : ""}>${esc(o.name)}</option>`).join("")}</optgroup>`).join("");
    const side = (it, i) => `<div class="duel-side"><select id="cmp-${i}" data-i="${i}" aria-label="${T.ui.compareBtn} ${i + 1}">${opts(it.id)}</select>
      <div class="duel-img">${it.image ? `<img src="${big(it)}" alt="${esc(it.name)}">` : `<span class="noimg">${T.ui.noImage}</span>`}</div>
      <div class="meta"><span>${T.kinds[it.kind]}</span><span>${T.types[it.type]}</span></div></div>`;
    const X = (it) => ({ ...S(it), ...Object.fromEntries(Object.entries(it.extra || {}).map(([k, v]) => [k, v[lvl === "base" ? 0 : 1]])) });
    const va = X(a), vb = X(b), label = (s) => T.stats[s] || T.extra[s];
    const keys = [...new Set([...G.stats, ...Object.keys(a.extra || {}), ...Object.keys(b.extra || {})])].filter((s) => va[s] != null || vb[s] != null);
    const rows = keys.map((s) => {
      const x = va[s], y = vb[s], w = x == null || y == null || x === y ? -1 : x > y ? 0 : 1;
      const cell = (v, me) => `<span class="num${w === me ? " win" : ""}">${fmt(v)}</span>`;
      const diff = x != null && y != null && x !== y ? `<small>${x > y ? "◂" : ""} ${fmt(Math.abs(x - y))} ${y > x ? "▸" : ""}</small>` : "";
      return `<div class="duel-row">${cell(x, 0)}<span class="duel-stat">${label(s)}${diff}</span>${cell(y, 1)}</div>`;
    }).join("") || `<p class="trust">${T.ui.noStats}</p>`;
    $("duel").innerHTML = `${side(a, 0)}<div class="duel-mid"><div class="level" role="group" aria-label="${T.ui.levelLabel}">${G.levels.map((l) => `<button type="button" data-l="${l}" aria-pressed="${l === lvl}">${T.levels[l]}</button>`).join("")}</div>${rows}</div>${side(b, 1)}`;
  }
  $("duel").addEventListener("change", (e) => { const sel = e.target.closest("select"); if (sel) { cmp[+sel.dataset.i] = sel.value; renderDuel(); } });
  $("duel").addEventListener("click", (e) => { const lv = e.target.closest("[data-l]"); if (lv) { lvl = lv.dataset.l; renderStage(); renderDuel(); renderLoadout(); } });

  function renderLoadout() {
    const items = loadout.map((id) => byId[id]);
    $("slots").innerHTML = G.slots.map((s, i) => { const it = items[i];
      return `<button type="button" class="slot" data-i="${i}"><span class="lbl">${T.slots[s.id]}</span>${it.image ? `<img src="${thumb(it)}" alt="">` : `<span style="height:120px"></span>`}<span class="nm">${esc(it.name)}</span><span class="sm">${T.types[it.type]}</span></button>`; }).join("");
    const blades = items.filter((i) => i.kind === "blade"), edges = items.filter((i) => i.kind === "edge");
    const sum = (arr, k) => arr.reduce((a, i) => a + (S(i)[k] || 0), 0);
    $("totals").innerHTML = [[T.ui.totBladeDmg, sum(blades, "damage")], [T.ui.totEdgeDmg, sum(edges, "damage")], [T.ui.totGuard, sum(items, "guardBreak")], [T.ui.totStatus, sum(items, "status")]]
      .map(([k, v]) => `<div class="total"><span>${k}</span><span class="num">${fmt(v)}</span></div>`).join("");
    const A = T.advice, say = [];
    const gb = blades.filter((b) => S(b).guardBreak != null);
    if (!gb.length) say.push(["warn", A.noGuard]);
    else say.push(["good", fill(gb.length > 1 ? A.guardN : A.guard1, { names: gb.map((b) => b.name).join(" & ") })]);
    const types = [...new Set(blades.map((b) => T.types[b.type].toLowerCase()))];
    say.push(types.length < 2 ? ["warn", fill(A.sameStyle, { type: types[0] })] : ["good", fill(A.twoStyles, { types: types.join(", ") })]);
    if (edges.some((e) => (rank(e, "guardBreak", lvl) || 0) > .75)) say.push(["good", A.edgeGuard]);
    if (!items.some((i) => S(i).status != null)) say.push(["", A.noStatus]);
    const unsure = items.filter((i) => !["agree", "verified"].includes(stateOf(i)));
    if (unsure.length) say.push(["warn", fill(A.unsure, { names: unsure.map((i) => i.name).join(", ") })]);
    $("advice").innerHTML = say.map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join("");
    history.replaceState(null, "", hashOf());
  }
  $("slots").addEventListener("click", (e) => {
    const b = e.target.closest("[data-i]"); if (!b) return;
    const it = byId[loadout[+b.dataset.i]];
    current = it.id; filter = { kind: it.kind, type: "" }; showSrc = false;
    renderTypes(); renderStage(true); renderRail(true);
    $("h-arsenal").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("share").addEventListener("click", () => {
    const url = location.href.split("#")[0] + hashOf();
    const done = (msg) => { $("toast").textContent = msg; setTimeout(() => ($("toast").textContent = ""), 2500); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => done(T.ui.copied), () => done(url)); else done(url);
  });
  $("reset").addEventListener("click", () => { loadout = DEFAULT.slice(); renderStage(); renderRail(); renderLoadout(); });
  window.addEventListener("hashchange", () => { const h = readHash(); if (h) { loadout = h; renderStage(); renderRail(); renderLoadout(); } });

  renderTypes(); renderStage(); renderRail(); renderDuel(); renderLoadout();
})();
</script>
